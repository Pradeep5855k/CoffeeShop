<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="coffeeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1810"/>
      <stop offset="50%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#1B0F0A"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C68F"/>
      <stop offset="50%" stop-color="#D4A373"/>
      <stop offset="100%" stop-color="#B07D48"/>
    </linearGradient>
    <radialGradient id="steamGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#D4A373" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2D1810" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#coffeeBg)"/>
  <circle cx="256" cy="220" r="160" fill="url(#steamGlow)"/>
  
  <!-- Steam Curves -->
  <path d="M 210 160 Q 195 120 215 90" stroke="url(#goldAccent)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.75"/>
  <path d="M 256 150 Q 275 110 250 80" stroke="url(#goldAccent)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 302 160 Q 320 125 300 95" stroke="url(#goldAccent)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.75"/>

  <!-- 3D Coffee Cup -->
  <!-- Saucer -->
  <ellipse cx="256" cy="380" rx="160" ry="24" fill="#140B07" opacity="0.8"/>
  <ellipse cx="256" cy="374" rx="150" ry="20" fill="url(#goldAccent)"/>
  <ellipse cx="256" cy="370" rx="140" ry="16" fill="#3E2723"/>

  <!-- Cup Body -->
  <path d="M 146 220 L 176 340 C 182 360, 330 360, 336 340 L 366 220 Z" fill="url(#goldAccent)"/>
  <path d="M 152 224 L 180 336 C 185 352, 327 352, 332 336 L 360 224 Z" fill="#FAF7F2"/>

  <!-- Cup Handle -->
  <path d="M 354 235 C 410 235, 410 320, 342 320" stroke="url(#goldAccent)" stroke-width="22" stroke-linecap="round" fill="none"/>

  <!-- Coffee surface with crema rim -->
  <ellipse cx="256" cy="220" rx="108" ry="28" fill="#5D4037"/>
  <ellipse cx="256" cy="220" rx="98" ry="22" fill="#3E2723"/>
  <ellipse cx="256" cy="220" rx="72" ry="14" fill="#C68B59" opacity="0.7"/>

  <!-- Rupees symbol subtly on cup -->
  <text x="256" y="295" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#3E2723" text-anchor="middle" opacity="0.85">₹</text>
</svg>
